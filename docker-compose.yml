version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: portfolio_db
    environment:
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_password
      POSTGRES_DB: portfolio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount file SQL để tự động import khi database được khởi tạo lần đầu
      - ./database_schema_and_data.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Application
  web:
    build: .
    container_name: portfolio_api
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-this}
      - FLASK_DB_URI=postgresql://portfolio_user:portfolio_password@db:5432/portfolio_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-jwt-secret-key-change-this}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./database_schema_and_data.sql:/app/database_schema_and_data.sql:ro

volumes:
  postgres_data:

