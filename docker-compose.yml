version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: portfolio_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_password}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
    # Chỉ expose port khi cần debug, comment out trong production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount file SQL để tự động import khi database được khởi tạo lần đầu
      - ./database_schema_and_data.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-portfolio_user} -d ${POSTGRES_DB:-portfolio_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_network
    # Giới hạn resources (optional, nhưng recommended)
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Flask Application
  web:
    build: .
    container_name: portfolio_api
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_DB_URI=${FLASK_DB_URI:-postgresql://${POSTGRES_USER:-portfolio_user}:${POSTGRES_PASSWORD:-portfolio_password}@db:5432/${POSTGRES_DB:-portfolio_db}}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./database_schema_and_data.sql:/app/database_schema_and_data.sql:ro
    networks:
      - portfolio_network
    # Giới hạn resources (optional)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

# Network isolation - chỉ các services trong network này mới communicate được
networks:
  portfolio_network:
    driver: bridge
    # Tăng cường security với internal network
    # Uncomment dòng dưới nếu không cần expose database ra ngoài
    # internal: true

volumes:
  postgres_data:
